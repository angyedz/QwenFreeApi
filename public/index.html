<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qwen Chat</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <!-- SVG sprite -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M3 12l18-8-6 8 6 8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 12h9" stroke="currentColor" stroke-width="1.6" fill="none"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z" fill="currentColor"/></symbol>
      <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9.5 3a2.5 2.5 0 0 0-2.5 2.5c0 .3.1.6.2.9A2.5 2.5 0 0 0 5 8.5 2.5 2.5 0 0 0 6.2 10.6 2.5 2.5 0 0 0 8.5 13 2.5 2.5 0 0 0 11 15.5c0 .6-.2 1.2-.6 1.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M14.5 3a2.5 2.5 0 0 1 2.5 2.5c0 1-.3 1.9-.9 2.6a2.5 2.5 0 0 1 1.3 2.8A2.5 2.5 0 0 1 15.5 13a2.5 2.5 0 0 1-2.5 2.5c0 .6.1 1 .4 1.4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
      <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 9h14M14 5l4 4-4 4M20 15H6M10 11l-4 4 4 4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-term" viewBox="0 0 24 24"><path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M7 10l3 3-3 3M13 15h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M14 3v5h4M9 13h6M9 17h6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
    </svg>

    <input type="checkbox" id="history-toggle" class="visually-hidden" aria-label="Показать историю чатов" />
    <div class="app">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-badge"><svg><use href="#i-bolt"/></svg></span>
          <span class="brand-name">Qwen Chat</span>
        </div>

        <button id="new-chat" class="btn-new" type="button">
          <svg><use href="#i-plus"/></svg>
          <span>Новый чат</span>
        </button>

        <div class="history-scroll">
          <div id="chat-list" class="chat-list empty">
            <div class="empty-hint"><svg><use href="#i-doc"/></svg><span>Пока пусто</span></div>
          </div>
        </div>

        <div class="sidebar-foot">
          <div id="model-block" class="row">
            <span class="row-label">Модель</span>
            <select id="model-select" class="select"></select>
          </div>
        </div>
      </aside>

      <!-- Main -->
      <main class="main">
        <div class="topbar">
          <label for="history-toggle" class="icon-btn sidebar-toggle" title="История">
            <svg><use href="#i-doc"/></svg>
          </label>
          <h1 id="chat-title" class="chat-title">Новый чат</h1>
          <div class="topbar-tools">
            <button id="btn-clear" class="icon-btn" title="Очистить чат"><svg><use href="#i-trash"/></svg></button>
          </div>
        </div>

        <div id="messages" class="messages">
          <div class="welcome">
            <div class="welcome-icon"><svg><use href="#i-bolt"/></svg></div>
            <p class="welcome-title">Чат с Qwen</p>
            <p class="welcome-sub">Включи режимы слева, чтобы дать модели инструменты.</p>
          </div>
        </div>

        <div class="composer">
          <div id="toolbar" class="toolbar">
          <button class="chip" type="button" data-setting="thinking" aria-pressed="false" title="Режим размышления">
              <svg><use href="#i-brain"/></svg>
              <span>Thinking</span>
              <span class="chip-check"><svg><use href="#i-check"/></svg></span>
          </button>
            <button class="chip" type="button" data-setting="webSearch" aria-pressed="false" title="Поиск в интернете">
              <svg><use href="#i-search"/></svg>
              <span>Search</span>
              <span class="chip-check"><svg><use href="#i-check"/></svg></span>
          </button>
            <button class="chip" type="button" data-setting="terminal" aria-pressed="false" title="Доступ к терминалу">
              <svg><use href="#i-term"/></svg>
              <span>Терминал</span>
              <span class="chip-check"><svg><use href="#i-check"/></svg></span>
          </button>
            <button class="chip" type="button" data-setting="files" aria-pressed="false" title="Доступ к файлам">
              <svg><use href="#i-folder"/></svg>
              <span>Файлы</span>
              <span class="chip-check"><svg><use href="#i-check"/></svg></span>
          </button>
          </div>

          <form id="composer-form">
            <textarea id="input" rows="1" placeholder="Напиши сообщение… (Enter — отправить, Shift+Enter — новая строка)" autocomplete="off"></textarea>
            <button id="send" class="send-btn" type="submit" title="Отправить">
              <svg><use href="#i-send"/></svg>
            </button>
          </form>
        </div>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
